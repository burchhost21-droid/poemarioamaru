<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta charset="UTF-8">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://poemarioamaru.onrender.com">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Amaru Poemarios</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            color: #d4d4d4;
            font-family: Georgia, serif;
            -webkit-user-select: none;
            user-select: none;
            padding-bottom: 40px;
        }
        .main-wrapper {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .hero-row {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 30px;
            background: #0d0d0d;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
        }
        .portada-frame {
            flex: 0 0 350px;
            max-width: 350px;
            height: 475px;
            background: #000;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 6px;
            position: relative; /* NUEVO: para que las flechitas se posicionen dentro */
        }
        #img-portada {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease; /* NUEVO: transición suave al cambiar de libro */
        }
        .col-derecha {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .resena-text {
            font-style: italic;
            font-size: 1.2rem;
            line-height: 1.7;
        }
        .acciones-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .accion-btn {
            width: 280px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .accion-btn.leer {
            background: #b8860b;
            color: white;
        }
        .accion-btn.leer:hover {
            background: #9e740a;
        }
        .accion-btn.descargar {
            background: #2a2a2a;
            color: #d4af37;
            border: 1px solid #d4af37;
        }
        .accion-btn.descargar:hover {
            background: #3a3a3a;
        }
        .accion-btn.donar {
            background: #009ee3;
            color: white;
        }
        .accion-btn.donar:hover {
            background: #0082c7;
        }
        .alias-copy {
            margin-top: 5px;
            font-size: 0.9rem;
            color: #d4af37;
            cursor: pointer;
            text-decoration: underline;
            background: none;
            border: none;
            font-family: Georgia, serif;
        }
        #lectorPrincipal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }
        .lector-contenedor {
            width: 85vw;
            height: 85vh;
            background: #f4f1ea;
            color: #1a1a1a;
            border: 2px solid #d4af37;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        #hoja-libro {
            flex-grow: 1;
            padding: 50px 25px 30px 40px;
            overflow-y: scroll;
            font-size: 1.3rem;
            line-height: 1.7;
            scroll-behavior: smooth;
            white-space: pre-wrap;
            word-wrap: break-word;
            transition: background 0.3s, color 0.3s;
        }
        #hoja-libro::-webkit-scrollbar {
            width: 8px;
        }
        #hoja-libro::-webkit-scrollbar-track {
            background: #e9e4d9;
            border-radius: 10px;
        }
        #hoja-libro::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 10px;
            border: 2px solid #e9e4d9;
        }
        .scroll-indicator {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            color: #d4af37;
            opacity: 0.8;
            pointer-events: none;
            animation: pulse 1.5s infinite;
            display: none;
            transition: color 0.3s;
        }
        @keyframes pulse {
            0% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
            50% { opacity: 1; transform: translateX(-50%) translateY(5px); }
            100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
        }
        .barra-navegacion {
            height: 60px;
            background: #e9e4d9;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            border-top: 1px solid #d4af37;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
            flex-shrink: 0;
        }
        .barra-navegacion button {
            width: auto;
            padding: 8px 20px;
            background: #1a1a1a;
            color: #d4af37;
            border: 1px solid #d4af37;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .barra-navegacion button:hover {
            background: #333;
        }
        .barra-navegacion span {
            font-family: serif;
            font-weight: bold;
            color: #333;
            transition: color 0.3s;
        }
        .barra-navegacion .modo-btn {
            background: transparent;
            border: 1px solid #aaa;
            color: #333;
            font-size: 1.2rem;
            padding: 6px 12px;
        }
        .barra-navegacion .modo-btn:hover {
            background: #ccc;
        }
        .lector-contenedor.modo-oscuro {
            background: #0d0d0d;
            border-color: #d4af37;
        }
        .lector-contenedor.modo-oscuro #hoja-libro {
            background: #0d0d0d;
            color: #b0d4ff;
        }
        .lector-contenedor.modo-oscuro #hoja-libro h1 {
            color: #d4af37 !important;
            border-bottom-color: #d4af37;
        }
        .lector-contenedor.modo-oscuro .barra-navegacion {
            background: #1a1a1a;
            border-top-color: #d4af37;
        }
        .lector-contenedor.modo-oscuro .barra-navegacion span {
            color: #b0d4ff;
        }
        .lector-contenedor.modo-oscuro .barra-navegacion button {
            background: #2a2a2a;
            color: #d4af37;
            border-color: #d4af37;
        }
        .lector-contenedor.modo-oscuro .barra-navegacion button:hover {
            background: #444;
        }
        .lector-contenedor.modo-oscuro .barra-navegacion .modo-btn {
            color: #d4af37;
            border-color: #d4af37;
            background: transparent;
        }
        .lector-contenedor.modo-oscuro .barra-navegacion .modo-btn:hover {
            background: #2a2a2a;
        }
        .lector-contenedor.modo-oscuro .scroll-indicator {
            color: #d4af37;
        }
        .lector-contenedor.modo-oscuro #hoja-libro::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .lector-contenedor.modo-oscuro #hoja-libro::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-color: #1a1a1a;
        }
        @media (max-width: 600px) {
            .hero-row {
                flex-direction: column;
                align-items: center;
            }
            .portada-frame {
                flex: 0 0 auto;
                max-width: 275px;
                height: 375px;
            }
            .col-derecha {
                align-items: center;
                text-align: center;
            }
            .accion-btn {
                width: 240px;
            }
            #hoja-libro {
                padding: 40px 8px 30px 12px;
                font-size: 0.95rem;
            }
            .barra-navegacion {
                gap: 10px;
                flex-wrap: wrap;
                height: auto;
                padding: 8px 0;
            }
            .barra-navegacion button {
                padding: 6px 12px;
                font-size: 0.9rem;
            }
        }

        /* ============================================
           FLECHITAS DEL CARRUSEL  < >
           ============================================ */

        /* Estilo base: solo el carácter, grande, dorado, sin fondo ni borde */
        .flecha {
            position: absolute;              /* Se posicionan dentro del .portada-frame */
            top: 50%;                        /* Centradas verticalmente */
            transform: translateY(-50%);     /* Ajuste fino del centrado vertical */
            border: 0;                       /* Sin borde */
            background: transparent;         /* Sin fondo */
            color: #d4af37;                  /* Dorado de la paleta */
            font-family: "Georgia", serif;   /* Misma tipografía del sitio */
            font-size: 4.5rem;               /* Grandecitas: ~72px en escritorio */
            line-height: 1;                  /* Sin espacio extra arriba/abajo */
            font-weight: 300;                /* Trazo fino y elegante */
            padding: 6px 14px;               /* Área clickeable cómoda */
            cursor: pointer;
            z-index: 3;                      /* Por encima de la portada */
            user-select: none;               /* No se selecciona el carácter al clickear */
            text-shadow: 0 0 18px rgba(212, 175, 55, 0.35); /* Halo dorado suave */
            animation: titilar 4s ease-in-out infinite;     /* Titileo lento */
            transition: transform 0.25s ease, color 0.25s ease, text-shadow 0.25s ease;
        }

        /* Hover: se agranda, brilla más y se pausa el titileo */
        .flecha:hover {
            color: #e9cd8f;                                 /* Dorado más claro */
            text-shadow: 0 0 28px rgba(212, 175, 55, 0.8);  /* Halo más intenso */
            transform: translateY(-50%) scale(1.15);        /* Crece un 15% */
            animation-play-state: paused;                   /* Frena el titileo */
        }

        /* Click: vuelve casi a su tamaño normal para dar feedback */
        .flecha:active {
            transform: translateY(-50%) scale(1.02);
        }

        /* Posición: una a cada costado del marco de la portada */
        .flecha.prev { left: 0; }   /* "<" a la izquierda */
        .flecha.next { right: 0; }  /* ">" a la derecha */

        /* ============================================
           TITILEO LENTO
           Va de opacidad 0.45 a 1 y el brillo dorado
           crece y decrece. Dura 4s, ida y vuelta.
           ============================================ */
        @keyframes titilar {
            0%, 100% {
                opacity: 0.45;
                text-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
            }
            50% {
                opacity: 1;
                text-shadow: 0 0 26px rgba(212, 175, 55, 0.75);
            }
        }

        /* Desfase: la flecha derecha arranca 2s después
           para que no titilen al mismo tiempo */
        .flecha.next { animation-delay: 2s; }

        /* ============================================
           RESPONSIVE: en celular se achican un poco
           ============================================ */
        @media (max-width: 520px) {
            .flecha {
                font-size: 3.2rem;   /* ~51px */
                padding: 4px 8px;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="main-wrapper">
        <div class="hero-row">
            <div class="portada-frame">
                <button class="flecha prev" onclick="cambiarLibro(-1)" aria-label="Libro anterior">&lt;</button>
                <img id="img-portada" src="/portada.jpg" alt="Portada del libro">
                <button class="flecha next" onclick="cambiarLibro(1)" aria-label="Libro siguiente">&gt;</button>
            </div>
            <div class="col-derecha">
                <div class="resena-text" id="resena-text">
                    Cuando los opuestos combaten, surgen escenas paradójicas y oníricas que escapan de los sueños.<br><br>
                    Entre tantos mensajes en símbolos no hay puntada sin hilo. Para interpretar no necesitás manuales esotéricos: solo necesitás el resto del contexto.
                </div>
                <div class="acciones-container">
                    <button class="accion-btn leer" onclick="iniciarLectura()">📖 Leer Ahora</button>
                    <button class="accion-btn descargar" onclick="descargarPDF()">📥 Descargar PDF</button>
                    <button class="accion-btn donar" onclick="donarMP()">💛 Donar con Mercado Pago</button>
                    <button class="alias-copy" onclick="copiarAlias()">Copiar alias: <span id="alias-mp">Cargando...</span></button>
                </div>
            </div>
        </div>
    </div>

    <div id="lectorPrincipal">
        <button onclick="cerrarLector()" style="position:fixed; right:20px; top:20px; width:45px; height:45px; border-radius:50%; background:#d4af37; border:none; font-size:30px; cursor:pointer; color:black; font-weight:bold; z-index:20001; display:flex; align-items:center; justify-content:center;">&times;</button>
        <div class="lector-contenedor" id="lectorContenedor">
            <div id="hoja-libro"></div>
            <div id="scroll-indicator" class="scroll-indicator">▼</div>
            <div class="barra-navegacion">
                <button onclick="cambiarPagina(-1)">ANT</button>
                <span>Página <span id="num-pagina">1</span></span>
                <button onclick="cambiarPagina(1)">SIG</button>
                <button class="modo-btn" onclick="toggleModoOscuro()" title="Alternar modo oscuro">🌙</button>
            </div>
        </div>
    </div>

    <script>
        let libroData = [];
        let paginaActual = 1;
        let aliasMP = 'amaru77mp';
        let donationLink = 'https://mpago.la/ejemplo';

        // ===== Libros del carrusel =====
        // Sumá acá los libros que quieras. El carrusel cicla entre ellos.
        // Cuando tengas el segundo libro, cambiá 'leer' y 'pdf' por las rutas reales.
        const librosDisponibles = [
            {
                portada: '/portada.jpg',
                resena: 'Cuando los opuestos combaten, surgen escenas paradójicas y oníricas que escapan de los sueños.<br><br>Entre tantos mensajes en símbolos no hay puntada sin hilo. Para interpretar no necesitás manuales esotéricos: solo necesitás el resto del contexto.',
                leer: '/api/libro',
                pdf: '/api/descargar-pdf'
            },
            {
                portada: '/portada2.jpg',
                resena: 'Próximamente: el segundo poemario. Otros símbolos, otras runas, otras geometrías del alma.',
                leer: '/api/libro',
                pdf: '/api/descargar-pdf'
            }
        ];

        let libroActivo = 0;

        function cambiarLibro(dir) {
            libroActivo = (libroActivo + dir + librosDisponibles.length) % librosDisponibles.length;
            const libro = librosDisponibles[libroActivo];

            // Fade out
            const img = document.getElementById('img-portada');
            img.style.opacity = 0;

            setTimeout(() => {
                img.src = libro.portada;
                img.alt = 'Portada del libro';
                document.getElementById('resena-text').innerHTML = libro.resena;
                img.style.opacity = 1;
            }, 200);

            // Reset del caché del libro para que al "Leer" traiga el nuevo
            libroData = [];
            paginaActual = 1;
        }

        async function cargarConfig() {
            try {
                const res = await fetch('/api/config');
                if (res.ok) {
                    const cfg = await res.json();
                    aliasMP = cfg.alias || 'amaru77mp';
                    donationLink = cfg.donationLink || 'https://mpago.la/ejemplo';
                    document.getElementById('alias-mp').innerText = aliasMP;
                } else {
                    document.getElementById('alias-mp').innerText = aliasMP;
                }
            } catch (e) {
                document.getElementById('alias-mp').innerText = aliasMP;
            }
        }

        function toggleModoOscuro() {
            const contenedor = document.getElementById('lectorContenedor');
            contenedor.classList.toggle('modo-oscuro');
            const isDark = contenedor.classList.contains('modo-oscuro');
            localStorage.setItem('modoOscuro', isDark ? 'true' : 'false');
            const btn = document.querySelector('.modo-btn');
            if (btn) btn.textContent = isDark ? '☀️' : '🌙';
            actualizarIndicadorScroll();
        }

        function aplicarModoGuardado() {
            const guardado = localStorage.getItem('modoOscuro');
            if (guardado === 'true') {
                const contenedor = document.getElementById('lectorContenedor');
                contenedor.classList.add('modo-oscuro');
                const btn = document.querySelector('.modo-btn');
                if (btn) btn.textContent = '☀️';
            }
        }

        function actualizarIndicadorScroll() {
            const hoja = document.getElementById('hoja-libro');
            const indicador = document.getElementById('scroll-indicator');
            if (!hoja || !indicador) return;
            const hayOverflow = hoja.scrollHeight > hoja.clientHeight + 5;
            const estaAlFinal = hoja.scrollTop + hoja.clientHeight >= hoja.scrollHeight - 20;
            if (hayOverflow && !estaAlFinal) {
                indicador.style.display = 'block';
            } else {
                indicador.style.display = 'none';
            }
        }

        async function iniciarLectura() {
            if (libroData.length > 0) {
                abrirLector();
                return;
            }
            const endpoint = librosDisponibles[libroActivo].leer;
            try {
                const res = await fetch(endpoint);
                if (res.ok) {
                    libroData = await res.json();
                    localStorage.setItem('libroOffline', JSON.stringify(libroData));
                    abrirLector();
                } else {
                    alert("No se pudo cargar el libro. Intentá de nuevo.");
                }
            } catch (e) {
                const cache = localStorage.getItem('libroOffline');
                if (cache) {
                    libroData = JSON.parse(cache);
                    abrirLector();
                } else {
                    alert("Sin conexión. Conectate a internet la primera vez.");
                }
            }
        }

        function abrirLector() {
            document.getElementById('lectorPrincipal').style.display = 'flex';
            aplicarModoGuardado();
            cargarPagina(paginaActual || 1);
            setTimeout(actualizarIndicadorScroll, 100);
        }

        function cargarPagina(num) {
            const p = libroData.find(i => i.pagina == num);
            if (p) {
                const headerPoema = p.titulo ? `<h1 style="color:#b8860b; font-family:Georgia; border-bottom:1px solid #d4af37; padding-bottom:15px; margin-bottom:25px; font-size:1.8rem;">${p.titulo}</h1>` : '';
                document.getElementById('hoja-libro').innerHTML = headerPoema + `<div style="white-space: pre-wrap;">${p.contenido}</div>`;
                document.getElementById('num-pagina').innerText = num;
                paginaActual = num;
                document.getElementById('hoja-libro').scrollTop = 0;
                setTimeout(actualizarIndicadorScroll, 50);
            }
        }

        function cerrarLector() {
            document.getElementById('lectorPrincipal').style.display = 'none';
        }

        function cambiarPagina(d) {
            let n = paginaActual + d;
            if (n >= 1 && n <= libroData.length) cargarPagina(n);
        }

        function descargarPDF() {
            window.open(librosDisponibles[libroActivo].pdf, '_blank');
        }

        function copiarAlias() {
            navigator.clipboard.writeText(aliasMP).then(() => {
                alert("Alias copiado: " + aliasMP);
            }).catch(() => {
                prompt("Copiá manualmente el alias:", aliasMP);
            });
        }

        function donarMP() {
            window.open(donationLink, '_blank');
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarConfig();
            const hoja = document.getElementById('hoja-libro');
            if (hoja) {
                hoja.addEventListener('scroll', actualizarIndicadorScroll);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (document.getElementById('lectorPrincipal').style.display === 'flex') {
                if (e.key === 'ArrowRight') cambiarPagina(1);
                if (e.key === 'ArrowLeft') cambiarPagina(-1);
                if (e.key === 'ArrowDown') {
                    document.getElementById('hoja-libro').scrollBy(0, 300);
                    actualizarIndicadorScroll();
                }
                if (e.key === 'ArrowUp') {
                    document.getElementById('hoja-libro').scrollBy(0, -300);
                    actualizarIndicadorScroll();
                }
            }
        });

        window.onload = () => {
            fetch('/api/libro')
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (data) {
                        libroData = data;
                        localStorage.setItem('libroOffline', JSON.stringify(data));
                    }
                })
                .catch(() => {});
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
